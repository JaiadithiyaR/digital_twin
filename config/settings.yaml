# Central configuration for the AI-Driven Self-Adaptive Network Digital Twin.
#
# Secrets (e.g. GOOGLE_API_KEY) are NEVER stored here — see .env.example.
# Every tunable referenced anywhere in src/ must be sourced from this file (via
# src/common/config.py) rather than hardcoded. See CLAUDE.md for the module map.

environment: demo # "demo" | "live" — selects mock vs real (OAI replay) telemetry/drift sources at startup

# ---------------------------------------------------------------------------
# Module 1 replacement — OAI RAN KPI export this Digital Twin replays (prompt2.md).
# Read-only, outside this repository. Never copied into git, never modified by this project.
# There is no database access anywhere in this system — only these already-exported flat CSVs.
# ---------------------------------------------------------------------------
data:
  # Raw OAI CSV export, read only by scripts/build_oai_dataset.py (the processed tables in
  # data/processed/oai/ are committed, so nobody needs the raw export just to run the system).
  # Relative paths resolve against the repo root; set OAI_ROOT in .env to point at an export
  # elsewhere on your machine (use a forward-slash/WSL path).
  oai_root: "data/raw/rankpi_kpi"
  splits:
    # Run 10 was the originally-intended TEST split, but its CSV export is genuinely incomplete
    # (9/24 tables, all left as `.csv.partial`, export stalled ~6h with no process running) and
    # cannot be re-exported (no database access in this environment) — confirmed, not assumed,
    # by inspecting _meta/export_run10.log against a complete run's own log. Per explicit user
    # direction, run 10 is excluded entirely (never read, not even its .partial files) and the
    # splits below use only verified-complete runs. Config-driven so run 10 (or any future run)
    # can be added here later with zero code changes once/if it is ever re-exported successfully.
    #
    # Phase 13 (claude_code_prompt_phase13.md §0/§1.1) redesign: TRAIN/TUNE = runs 3, 6, 7
    # (leave-one-run-out CV over these three, then a final retrain on all three combined);
    # TEST = run 8, held out strictly — never used for training, tuning, debugging, or smoke
    # tests. Run 7 doubles as the designated smoke-test run (never run 8).
    train: [3, 6, 7]
    test: [8]
    smoke_test_run: 7

# ---------------------------------------------------------------------------
# Module 1/2 — Telemetry source & preprocessing
# ---------------------------------------------------------------------------
telemetry:
  source: mock # "mock" | "oai_replay" — real telemetry replays exported OAI RAN KPI CSVs (see `data:` above and `replay:` below)
  mock:
    seed: 42
    num_sessions: 6
    emit_interval_seconds: 1.0
    # Injected imperfection so the mock source exercises the same quality-tracking path real
    # replayed telemetry would — a demo run must exercise the same pipeline as live (prompt.md
    # §48). Unit-test use only (prompt2.md: "mock source stays for unit tests only").
    missing_feature_rate: 0.03
  replay:
    speed: 0.0 # 0 = as fast as possible (default — demo/test runs); 1.0 = real time; >1 = accelerated
    default_split: test
  preprocessing:
    max_missing_ratio: 0.2 # above this, a tick/window is flagged low-quality rather than used

# ---------------------------------------------------------------------------
# Module 3 — Continuous synchronization (telemetry -> D1, no manual sync step)
# ---------------------------------------------------------------------------
synchronization:
  batch_size: 20 # flush a batch into D1 after this many raw records accumulate...
  batch_timeout_seconds: 2.0 # ...or after this much time has elapsed, whichever comes first
  shutdown_join_timeout_seconds: 5.0 # phase13 §8.4: ContinuousOrchestrator.stop()'s bounded wait for its background threads to actually exit

# ---------------------------------------------------------------------------
# Module 3/4 — Synchronization & D1 state/history store
# ---------------------------------------------------------------------------
storage:
  root_dir: "data"
  bootstrap_dir: "data/bootstrap"
  telemetry_dir: "data/telemetry"
  evaluation_dir: "data/evaluation"
  artifacts_dir: "data/artifacts"
  models_dir: "data/models" # versioned model registry artifacts (gitignored)
  d1_current_state_path: "data/artifacts/d1_current_state.parquet"
  d1_history_path: "data/artifacts/d1_history.parquet"
  d1_quarantine_path: "data/artifacts/d1_quarantine.parquet"
  history_retention_rows: 500000 # oldest rows pruned beyond this (historical analysis window)
  # Min seconds between full D1 Parquet rewrites (0 = rewrite on every sync batch). Each rewrite
  # re-serializes the whole table (~1s at 25k rows on a WSL /mnt/c mount), which otherwise caps
  # live ingestion; in-memory D1 is always current, and stop() flushes anything outstanding.
  persist_min_interval_seconds: 10.0

# ---------------------------------------------------------------------------
# Module 5–10 replacement — the 7 OAI KPI prediction components (prompt2.md Step 5). Dependency
# graph: dl_bler/ul_bler/dl_prb/ul_prb are roots (lagged features only); dl_throughput depends on
# dl_bler+dl_prb; ul_throughput depends on ul_bler+ul_prb; dl_rlc_delay depends on
# dl_throughput+dl_bler. See src/dt_models/{dl_bler,ul_bler,dl_prb,ul_prb,dl_throughput,
# ul_throughput,dl_rlc_delay}.py.
# ---------------------------------------------------------------------------
dt_models:
  bootstrap_min_rows: 200 # minimum bootstrap rows required before initial training
  # Shared regularized default (150 trees, depth 4, subsample 0.8) for all 7 components — tuned
  # ONLY against VAL (run 7), never TEST (run 8), exactly like the retired jitter component's own
  # historical regularization fix. The original 300-tree/depth-6 default (train=[3,6], unseen
  # val=[7]) was genuinely WORSE than a trivial previous-second persistence baseline on 5 of 7
  # components (classic overfitting on real, highly-autocorrelated 1s RAN KPIs across a modest
  # 2-run training set) — this shallower config beats the persistence baseline on all 7.
  dl_bler:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }
  ul_bler:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }
  dl_prb:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }
  ul_prb:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }
  dl_throughput:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }
  ul_throughput:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }
  dl_rlc_delay:
    model_type: xgboost
    params: { n_estimators: 150, max_depth: 4, learning_rate: 0.05, subsample: 0.8, random_state: 42 }

# ---------------------------------------------------------------------------
# Module 12 — Fidelity engine (deterministic; see CLAUDE.md formula)
# ---------------------------------------------------------------------------
fidelity:
  epsilon: 1.0e-8 # denominator stabilizer in min-max normalization — never hardcode elsewhere
  rolling_window_length: 200 # number of historical evaluation points used for min-max reference
  min_history_for_normalization: 10 # below this, normalization is treated as insufficient-history (explicit handling, no fabricated score)
  metrics: [rmse, mae, wasserstein, mk_mmd]
  mk_mmd:
    kernel: rbf
    gamma: null # null => median-heuristic bandwidth
  # Unified Fidelity Score (prompt.md §16a) — a system-health REPORTING aggregate of every
  # component's FidelityScore_c. It no longer triggers adaptation (see the per-component policy below).
  unified_weights: null # null => equal weighting across all currently-defined components (never hardcode unequal weights)
  unified_min_components: 2 # fewer well-defined component scores than this -> UnifiedFidelityScore is None (insufficient_history), same never-fabricate discipline as the per-component formula
  # Per-component adaptation policy (src/fidelity/component_policy.py): each component c is
  # adapted on its OWN FidelityScore_c, independently of every other component. The two values
  # below are the defaults applied to every component:
  trigger_threshold: 0.5 # component c is flagged when its FidelityScore_c drops below this...
  trigger_min_consecutive_evaluations: 3 # ...for this many consecutive fresh evaluation cycles (debounce — a single bad cycle must never fire a spurious adaptation)
  # Optional per-component overrides (unlisted components use the defaults above), e.g.
  #   component_policies:
  #     dl_rlc_delay: { threshold: 0.4, min_consecutive_evaluations: 4 }
  component_policies: {}

# ---------------------------------------------------------------------------
# Module 11 — Drift detection interface (algorithm itself is external, prompt.md §0.19)
# ---------------------------------------------------------------------------
drift:
  source: mock # "mock" | "external" — external adapter connects a real detector later
  # DT scopes an incoming drift event may name; must match src/dt_models/*.py COMPONENT_NAME
  # values (Module 5's DTModelRegistry) so drift_detector.py can actually route an event to a
  # real, adaptable component instead of an unknown/stale name. Shared by both the mock source
  # and the interface's own validation — a real external detector's events are checked against
  # this exact same list.
  valid_components: [dl_throughput, ul_throughput, dl_rlc_delay, dl_prb, ul_prb, dl_bler, ul_bler]
  severity_range: [0.0, 1.0] # inclusive bounds a drift event's severity must fall within
  mock:
    seed: 7
    emit_interval_seconds: 30.0
    # Fraction of mock events deliberately malformed (unknown component / out-of-range severity /
    # missing timestamp / non-dict metadata), so the interface's quarantine path is genuinely
    # exercised in testing — mirrors telemetry.mock.missing_field_rate/out_of_range_rate. Never
    # present in a real external detector's feed; this knob exists only for this mock source.
    invalid_event_rate: 0.05

# ---------------------------------------------------------------------------
# Module 13 — PPO RL decision agent
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Module 13 — Decision & Root-Cause Analysis Agent (design pivot: replaces the deleted PPO RL
# policy's `ppo:` block — see CLAUDE.md §12's design-pivot notice). No training hyperparameters
# here — this is a direct, genuine LLM call on every trigger, never a trained policy.
# ---------------------------------------------------------------------------
decision_agent:
  action_mapping: { 0: recalibrate, 1: regenerate, 2: expand_scope } # the fixed 3-strategy enum (prompt.md §19) — never a 4th/5th
  fallback:
    # Deterministic fallback used ONLY on genuine decision-agent infrastructure failure (LLM
    # transport failure, or structured-output schema validation exhausting its retries) — never a
    # routine substitute for a genuine LLM call. Every use must be logged (CLAUDE.md §6).
    enabled: true
    default_strategy: recalibrate

# ---------------------------------------------------------------------------
# Modules 14–16 — Adaptation agents / concurrency
# ---------------------------------------------------------------------------
adaptation:
  # Phase 13 §2: at most one adaptation per component at a time; a second trigger for an
  # already-locked component is coalesced (merged, keeping the highest severity) rather than
  # queued as a separate cycle — see src/main.py's _enqueue_trigger/_pending_by_component.
  lock_policy: coalesce # "queue" | "coalesce" | "defer" for a second trigger on a component that is mid-adaptation
  # Adaptations run on worker threads, so fidelity cycles never pause; different components can
  # adapt at the same time (never two adaptations of the same component).
  allow_concurrent_components: true
  max_concurrent_adaptations: 2 # worker threads (each trains models / runs a sandbox / calls the LLM)
  # Adaptation loop: a REJECTed or failed attempt is retried with the rejection details fed back to
  # the decision agent and the adaptation agents, until a candidate is ACCEPTed, the component
  # recovers above its threshold, or this many attempts have been made (then it stays flagged and
  # its own policy re-triggers it later).
  max_adaptation_attempts: 5
  shutdown_wait_seconds: 20 # stop()/Ctrl-C: wait this long for in-flight adaptations, then record them as interrupted
  recalibration:
    training_window_hours: 24
    min_training_rows: 200
    # Train on the original TRAIN pool + the recent window (recent rows weighted x recent_sample_weight),
    # not the recent window alone (a few hundred rows early in a run can never match production).
    include_reference_data: true
    recent_sample_weight: 5.0
  regeneration:
    max_llm_iterations: 2 # LLM generates -> sandbox rejects -> LLM retries with the rejection reason as feedback, up to this many attempts
    training_window_hours: 48 # wider than recalibration's default — rebuilding a pipeline from scratch reasonably wants more history than a lightweight refit
    min_training_rows: 200
    include_reference_data: true # the generated pipeline is trained on the TRAIN pool + recent window
  expand_scope:
    max_llm_iterations: 2 # shared retry budget for BOTH the design-proposal step (invalid name/target/dependencies) and the implementation-generation step (sandbox rejection)
    training_window_hours: 48 # a brand-new component has no prior deployment to lean on, same "wants more history" reasoning as regeneration
    min_training_rows: 200
  verification_delta: 0.01 # δ in FidelityScore_new > FidelityScore_old + δ — never hardcode elsewhere

# ---------------------------------------------------------------------------
# Module 45 — Sandbox execution
# ---------------------------------------------------------------------------
sandbox:
  workspace_root: "data/artifacts/sandbox"
  timeout_seconds: 120
  max_output_bytes: 1000000

# ---------------------------------------------------------------------------
# Module 18 (D2) — RAG knowledge base
# ---------------------------------------------------------------------------
rag:
  chroma_path: "rag_data/chroma"
  collection_name: "dt_knowledge_base"
  corpus_dirs:
    oran: "rag_data/oran"
    digital_twin: "rag_data/digital_twin"
    policies: "rag_data/policies"
    history: "rag_data/history"
  chunk_size: 800
  chunk_overlap: 100
  top_k: 5
  embedding_model: "all-MiniLM-L6-v2"

# ---------------------------------------------------------------------------
# Baseline experiment modes (prompt2.md Step 6) — all run on the SAME OAI replay splits/seed/
# fidelity settings as the full system, for a fair comparison.
# ---------------------------------------------------------------------------
baselines:
  window_seconds: 60 # one evaluation/decision window = 60 s of replayed DATA time (run 8 -> 62 windows); identical for every mode
  max_windows: null # null = the whole TEST run; CLI --max-windows overrides it (smoke runs)
  seeds: [1, 2, 3] # phase13 §4: full_system is run once per seed, mean +/- std reported
  periodic_retrain:
    interval_seconds: 600 # recalibrate ALL 7 components every 10 min of replayed data, regardless of fidelity
    use_verification_gate: false # blind retraining: deploy unconditionally (ablation step 1)
  rule_based:
    # Deterministic severity thresholds (never an LLM call) mapping a trigger's severity to a
    # strategy — the same closed 3-strategy enum Module 13 itself is constrained to.
    recalibrate_max_severity: 0.3
    regenerate_max_severity: 0.7
    # severity > regenerate_max_severity -> expand_scope
  fallback_rate_invalid_threshold: 0.1 # phase13 §4: if >10% of full_system's decisions were LLM-infra fallbacks, flag that run invalid in the comparison

# ---------------------------------------------------------------------------
# LLM (Google AI / Gemini direct API) — module name/version only; key lives in .env. Read via
# src/llm/google_client.py:GoogleClient — never hardcode a model ID or key in agent code.
# ---------------------------------------------------------------------------
llm:
  # "gemini-2.5-flash" was tried first (matched this project's original design intent) but a real
  # live API call against it returned a genuine 404: "This model ... is no longer available to
  # new users ... use models/gemini-3.6-flash" — verified directly against the real API with a
  # real key (2026-09-24), not assumed. Never a hardcoded deprecated model ID — this is the ONLY
  # place it's set.
  model: "gemini-3.6-flash"
  # Output cap per call — thinking tokens count toward it on Gemini thinking models. 8000 cut a
  # regenerate response off mid-JSON in a live run (structured-output retry needed); code
  # generation needs headroom. Only tokens actually generated are billed.
  max_tokens: 32768
  # Unlike the old Anthropic Messages API, google-genai's GenerateContentConfig DOES expose a
  # real temperature control (verified directly against the installed SDK's types.py, not
  # assumed) — low temperature genuinely reduces sampling randomness on this provider.
  temperature: 0.2
  # `effort` maps onto Gemini's ThinkingLevel (MINIMAL/LOW/MEDIUM/HIGH — no xhigh/max; both clamp
  # to HIGH). See src/llm/google_client.py's module docstring. null omits thinking_config entirely.
  # This is the shared/default value — effort_by_role below overrides it per role (phase13 §3.4).
  effort: medium
  effort_by_role:
    decision: low # Module 13's structured strategy/RCA call — a closed 3-way enum + short text, doesn't need deep reasoning
    codegen: medium # regeneration/expand-scope's source-code-generation calls — genuinely benefits from more thinking
    explanation: low # verification/lifecycle's human-readable prose, strictly AFTER the deterministic decision is already final
  timeout_seconds: 90
  # Phase 13 §3.3 — explicit context caching of the static prompt prefix (one cache per
  # experiment run; deleted at the end of the run, including on error — see
  # baselines/run_all.py). Caching is a pure transport/cost optimization: the assembled
  # prompt the model actually sees is always byte-identical to the uncached version (see
  # tests/unit/test_google_client.py's dedicated test).
  caching:
    enabled: true
    ttl_seconds: 1800 # 30 minutes — comfortably longer than one baseline experiment run (~10-15s observed in Phase 12) with headroom for a slower real LLM-driven run
    min_cacheable_chars: 4000 # conservative proxy for "below the model's minimum cacheable token count" — real Gemini minimums are token-based/model-specific; skip-and-log rather than guess
  # Phase 13 §3.6 — budget guard: an experiment stops cleanly (never silently falls back to the
  # deterministic default strategy because of the budget) once spent+estimated would exceed this.
  budget_usd: 20.0
  # Phase 13 §3.7 — "flex" is allowed only for speed=0 experiments, never live demos; the
  # deployment flow (--mode live) always forces "standard" regardless of this default.
  service_tier: standard
  # Phase 13 §3.5 — USD per 1,000,000 tokens. A best-effort estimate for this project's
  # configured model (not a verified, currently-published rate card for "gemini-3.6-flash") —
  # update these four numbers from the real rate card before trusting absolute cost totals;
  # config-driven specifically so that update never needs a code change (prices change on
  # 1 January 2027, per this spec's own note).
  rates:
    input_per_million: 0.10
    output_per_million: 0.40
    cached_input_per_million: 0.025
    cache_storage_per_million_per_hour: 1.00
  max_retries: 3 # shared budget: this client's own transport retry loop AND its structured-output validation retry loop
  retry_backoff_seconds: 1.0 # base for this client's own exponential backoff (capped at 30s internally); the SDK's own transport retry defaults to "never retry" so this is the only retry/backoff path

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  format: json # "json" | "text"
  log_dir: "logs" # full structured JSON log: logs/digital_twin.log (rotating)
  component_fidelity_log: "logs/component_fidelity.csv" # one row per component per fidelity cycle (score, threshold, policy state)
  adaptation_decisions_log: "logs/adaptation_decisions.jsonl" # one line per handled trigger — including skipped/failed attempts
  console_transcript_dir: "logs/console" # plain-text copy of each `python -m src.main` run's console output (null disables)

# ---------------------------------------------------------------------------
# Module 19 — Lifecycle management / evaluation
# ---------------------------------------------------------------------------
lifecycle:
  records_path: "data/artifacts/lifecycle_records.jsonl"
  reports_dir: "data/artifacts/maintenance_reports"

evaluation:
  window_size: 200 # comparable evaluation window (rows) used for before/after fidelity comparison
