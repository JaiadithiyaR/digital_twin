# Ablation step 0 — static: bootstrap models, never adapted. Per-component fidelity triggers are
# detected and logged into adaptation_events.jsonl (gate_result=null, skipped_reason set) but never
# dispatched — no agent, no sandbox, no LLM. The "do nothing" floor every other mode is compared against.
mode: static
description: >
  Bootstrap components only. Triggers are logged but never dispatched. No LLM calls at all.
seeds: [1]  # deterministic given the fixed bootstrap + fixed replay
uses_llm: false
