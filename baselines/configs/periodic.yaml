# Ablation step 1 — periodic_retrain ("blind" adaptation): every component is recalibrated on a
# fixed schedule of replayed DATA time, regardless of fidelity. No trigger, no decision agent, no
# LLM, no sandbox (recalibration never needs one). By default the retrained model is deployed
# WITHOUT the verification gate — that is what makes it blind (set use_verification_gate: true to
# run the gated variant). Triggers are still detected and logged so every mode reports them.
mode: periodic_retrain
description: >
  All 7 components recalibrated every `interval_seconds` of replayed data on the data seen so far
  (+ the TRAIN pool, as in the live system), deployed unconditionally.
seeds: [1]  # deterministic: no LLM, no randomness
uses_llm: false
interval_seconds: 600  # every 10 minutes of replayed data -> 6 retrains of all 7 components over run 8
use_verification_gate: false
components: [dl_bler, ul_bler, dl_prb, ul_prb, dl_throughput, ul_throughput, dl_rlc_delay]
