# Ablation step 3 — full_system (proposed): per-component fidelity trigger -> the real
# knowledge-based LLM+RAG Decision & Root-Cause Analysis Agent (Module 13) -> the real Modules
# 14/15/16 agents -> the real Module 17 verification gate -> hot swap on ACCEPT, repeated with
# rejection feedback up to adaptation.max_adaptation_attempts (the live system's retry loop).
# Run once per seed. External drift is disabled in the live system, so the replay, bootstrap,
# windows, fidelity config and trigger policy are identical across seeds; run-to-run variation
# comes from the LLM itself (decisions and generated code), which is what the 3 repeats measure.
mode: full_system
description: >
  Trigger -> real DecisionAgent.decide_safe() (genuine LLM call, RAG-grounded) -> the real
  Modules 14/15/16 agents -> the real Module 17 verification gate -> hot swap on ACCEPT, with retries.
seeds: [1, 2, 3]
uses_llm: true  # decision + codegen + verification-explanation roles
preflight_run: 7  # pre-flight (phase13 §3.8) runs against run 7, never run 8
budget_usd: 20.0
service_tier: standard
fallback_rate_invalid_threshold: 0.1  # >10% decisions from the deterministic fallback -> flag run invalid
